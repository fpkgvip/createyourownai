[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyoai"
version = "0.1.0"
description = "Bring-your-own-key autonomous model research CLI"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "requests>=2.32"]

[project.optional-dependencies]
train = ["torch==2.9.1", "kernels>=0.11.7", "matplotlib>=3.10.8", "numpy>=2.2.6", "pandas>=2.3.3", "pyarrow>=21.0.0", "requests>=2.32", "rustbpe>=0.1.0", "tiktoken>=0.11.0"]
dev = ["pytest>=8"]

[project.scripts]
cyoai = "cyoai.cli:main"

[tool.setuptools.packages.find]
include = ["cyoai*"]

[tool.setuptools.package-data]
cyoai = ["core/*.py", "core/*.md", "core/*.toml", "core/autoresearch/*.py", "core/autoresearch/*.md", "core/autoresearch/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
